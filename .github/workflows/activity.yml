name: Generate activity graph

# Scheduled + manual only — this job commits to main, so a push trigger
# would make it retrigger itself.
on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

jobs:
  activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/contrib-graph.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets/activity.svg)" ]; then
            git add assets/activity.svg
            git commit -m "chore: refresh contribution activity graph"
            git push
          else
            echo "no change"
          fi
