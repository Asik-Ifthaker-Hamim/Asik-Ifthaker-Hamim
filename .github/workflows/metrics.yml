name: Generate metrics

# Scheduled + manual only. This job commits back to main, so a push trigger
# would make it retrigger itself forever.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Language and repository metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Asik-Ifthaker-Hamim
          filename: assets/metrics.svg
          template: classic
          base: header, repositories
          config_timezone: Asia/Dhaka
          config_theme: dark
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
          extras_css: |
            :root {
              --color-canvas-default: #08090c;
              --color-canvas-subtle: #0d0f14;
              --color-border-default: #1c2030;
              --color-fg-default: #e7ecf3;
              --color-fg-muted: #8a93a6;
              --color-accent-fg: #22d3ee;
            }
            h2 { color: #22d3ee !important; }
