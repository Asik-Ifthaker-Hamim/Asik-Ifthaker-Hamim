<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="1200" height="8" role="img" aria-label="">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.1"/>
    </linearGradient>
    <style>
      .pip { animation: run 5s linear infinite; }
      @keyframes run { 0% { transform: translateX(0) } 100% { transform: translateX(1200px) } }
    </style>
  </defs>
  <rect y="3" width="1200" height="2" fill="url(#g)"/>
  <circle class="pip" cx="0" cy="4" r="3" fill="#22d3ee"/>
</svg>
